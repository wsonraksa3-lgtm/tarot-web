<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    font-family:"Kanit",sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(168,76,255,.28),
            transparent 30%
        ),

        radial-gradient(
            circle at 100% 80%,
            rgba(255,65,181,.20),
            transparent 32%
        ),

        linear-gradient(
            145deg,
            #0d0717 0%,
            #180a29 50%,
            #0c0615 100%
        );

    overflow-x:hidden;
}

button,
textarea{
    font-family:inherit;
}


/* =========================================================
   APP
========================================================= */

.app{

    width:100%;

    max-width:720px;

    margin:auto;

    padding:
        20px
        15px
        45px;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    text-align:center;

    padding:
        8px
        5px
        20px;
}

.logo{

    font-size:32px;

    font-weight:700;

    line-height:1.2;

    background:
        linear-gradient(
            90deg,
            #ffe38a,
            #ff8dde,
            #a88cff
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{

    margin-top:7px;

    color:#cfc1dc;

    font-size:14px;

    line-height:1.5;
}


/* =========================================================
   MAIN CARD
========================================================= */

.main-panel{

    width:100%;

    padding:18px;

    border-radius:24px;

    background:
        rgba(255,255,255,.065);

    border:
        1px solid rgba(255,255,255,.11);

    box-shadow:
        0 20px 60px rgba(0,0,0,.28);

    backdrop-filter:blur(14px);
}


/* =========================================================
   SECTION TITLE
========================================================= */

.section-title{

    margin-bottom:10px;

    font-size:16px;

    font-weight:500;

    color:#f5ebff;
}


/* =========================================================
   TOPICS
========================================================= */

.topic-buttons{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:9px;

    margin-bottom:20px;
}

.topic-btn{

    min-height:45px;

    border:1px solid
        rgba(255,255,255,.10);

    border-radius:13px;

    color:#eee;

    background:
        rgba(255,255,255,.06);

    font-size:15px;

    cursor:pointer;

    transition:
        transform .2s,
        background .2s,
        border .2s;
}

.topic-btn:active{

    transform:scale(.97);
}

.topic-btn.active{

    color:#fff;

    border-color:
        rgba(212,126,255,.6);

    background:
        linear-gradient(
            135deg,
            #874cff,
            #e63cb9
        );

    box-shadow:
        0 6px 20px
        rgba(184,70,255,.28);
}


/* =========================================================
   QUESTION
========================================================= */

.question-title{

    margin-bottom:9px;

    font-size:16px;

    font-weight:500;
}

textarea{

    display:block;

    width:100%;

    min-height:110px;

    padding:14px;

    resize:none;

    outline:none;

    border-radius:15px;

    border:
        1px solid
        rgba(255,255,255,.12);

    color:#fff;

    background:
        rgba(0,0,0,.24);

    font-size:16px;

    line-height:1.6;

    transition:.2s;
}

textarea::placeholder{

    color:#92879d;
}

textarea:focus{

    border-color:
        rgba(190,105,255,.7);

    box-shadow:
        0 0 0 3px
        rgba(190,105,255,.10);
}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.action-buttons{

    display:grid;

    grid-template-columns:
        1fr;

    gap:9px;

    margin-top:13px;
}

.main-btn{

    width:100%;

    min-height:54px;

    border:0;

    border-radius:15px;

    color:#fff;

    font-size:17px;

    font-weight:600;

    background:
        linear-gradient(
            135deg,
            #8b4dff,
            #e43bb9
        );

    box-shadow:
        0 8px 25px
        rgba(181,67,255,.30);

    cursor:pointer;

    transition:.2s;
}

.main-btn:active{

    transform:scale(.98);
}

.reset-btn{

    width:100%;

    min-height:45px;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:13px;

    color:#d9d0df;

    background:
        rgba(255,255,255,.055);

    font-size:15px;

    cursor:pointer;
}


/* =========================================================
   CARDS SECTION
========================================================= */

.cards-section{

    margin-top:27px;
}

.cards-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;

    width:100%;
}

.card-box{

    width:100%;

    text-align:center;

    min-width:0;
}

.position{

    min-height:43px;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-bottom:7px;

    color:#e9dff1;

    font-size:12px;

    line-height:1.35;
}


/* =========================================================
   CARD
========================================================= */

.card{

    width:100%;

    aspect-ratio:
        1023 / 1538;

    position:relative;

    perspective:1000px;

    border-radius:9px;
}

.card-inner{

    width:100%;
    height:100%;

    position:relative;

    transform-style:preserve-3d;

    transition:
        transform .75s
        cubic-bezier(.2,.75,.25,1);
}

.card.opened .card-inner{

    transform:
        rotateY(180deg);
}


/* =========================================================
   CARD FRONT / BACK
========================================================= */

.card-back,
.card-front{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    border-radius:9px;

    backface-visibility:hidden;

    -webkit-backface-visibility:hidden;
}

.card-back{

    display:flex;

    justify-content:center;
    align-items:center;

    border:
        1px solid
        rgba(255,255,255,.14);

    background:

        radial-gradient(
            circle,
            rgba(208,125,255,.18),
            transparent 45%
        ),

        linear-gradient(
            145deg,
            #29113f,
            #0e0718
        );

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.4);
}

.card-symbol{

    font-size:30px;

    color:#d6a1ff;

    text-shadow:
        0 0 18px
        rgba(210,130,255,.9);
}

.card-front{

    transform:
        rotateY(180deg);

    background:transparent;
}

.card-front img{

    width:100%;
    height:100%;

    display:block;

    margin:0;
    padding:0;

    object-fit:fill;
}


/* =========================================================
   HINT
========================================================= */

.card-hint{

    min-height:20px;

    margin-top:5px;

    color:#91879a;

    font-size:10px;

    line-height:1.2;
}


/* =========================================================
   READING
========================================================= */

.reading{

    display:none;

    margin-top:28px;

    animation:
        fadeUp .65s ease;
}

.reading.show{

    display:block;
}

@keyframes fadeUp{

    from{

        opacity:0;

        transform:
            translateY(18px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}

.reading-header{

    text-align:center;

    margin-bottom:15px;
}

.reading-title{

    font-size:23px;

    font-weight:600;

    background:
        linear-gradient(
            90deg,
            #ffe18a,
            #ff8fdc
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.reading-subtitle{

    margin-top:3px;

    color:#9d91a8;

    font-size:12px;
}


/* =========================================================
   READING BOX
========================================================= */

.reading-box{

    margin-bottom:10px;

    padding:15px;

    border-radius:16px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(0,0,0,.18);
}

.reading-box h3{

    margin:
        0
        0
        7px;

    font-size:16px;

    color:#ffd977;
}

.reading-box p{

    margin:0;

    color:#eee;

    font-size:15px;

    line-height:1.8;
}


/* =========================================================
   COPY
========================================================= */

.copy-btn{

    width:100%;

    min-height:48px;

    margin-top:2px;

    border:0;

    border-radius:14px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #6152ff,
            #ad4eff
        );

    font-size:15px;

    cursor:pointer;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    padding-top:22px;

    text-align:center;

    color:#74697e;

    font-size:11px;
}


/* =========================================================
   TABLET / DESKTOP
========================================================= */

@media(min-width:600px){

/* =========================================================

@media(min-width:900px){

    }

    }

/* =========================================================
   START READING
========================================================= */

function startReading(){

    const question =
        document
            .getElementById("question")
            .value
            .trim();


    if(!question){

        alert(
            "กรุณาพิมพ์คำถามก่อนเปิดไพ่ครับ"
        );

        document
            .getElementById("question")
            .focus();

        return;
    }


    /* ซ่อนคำทำนายเดิม */

    document
        .getElementById("reading")
        .classList.remove("show");


    /* รีเซ็ต */

    selectedCards = [];

    openedCards = 0;


    for(let i=0;i<3;i++){

        document
            .getElementById("card"+i)
            .classList.remove("opened");


        document
            .getElementById("img"+i)
            .src = "";


        document
            .getElementById("hint"+i)
            .textContent =
                "กำลังเตรียมไพ่...";

    }


    /* สุ่มไพ่ไม่ซ้ำ */

    const shuffled =
        [...deck].sort(
            () => Math.random() - 0.5
        );


    selectedCards =
        shuffled.slice(0,3);


    /* ใส่รูป */

    selectedCards.forEach(
        (card,index)=>{

            document
                .getElementById("img"+index)
                .src =
                    IMAGE_BASE +
                    card.file;

        }
    );


    /*
       เปิดใบที่ 1
    */

    setTimeout(()=>{

        document
            .getElementById("card0")
            .classList.add("opened");


        document
            .getElementById("hint0")
            .textContent =
                "เปิดแล้ว";

        openedCards = 1;

    },250);



    /*
       เปิดใบที่ 2
    */

    setTimeout(()=>{

        document
            .getElementById("card1")
            .classList.add("opened");


        document
            .getElementById("hint1")
            .textContent =
                "เปิดแล้ว";

        openedCards = 2;

    },850);



    /*
       เปิดใบที่ 3
    */

    setTimeout(()=>{

        document
            .getElementById("card2")
            .classList.add("opened");


        document
            .getElementById("hint2")
            .textContent =
                "เปิดแล้ว";

        openedCards = 3;

    },1450);



    /*
       แสดงคำทำนาย
    */

    setTimeout(()=>{

        generateReading();

    },2200);

}

   YES / NO QUESTION
========================================================= */

function isYesNoQuestion(question){

    const patterns = [

        "ไหม",
        "มั้ย",
        "หรือไม่",
        "หรือเปล่า",
        "รึเปล่า",
        "ได้ไหม",
        "จริงไหม",
        "ใช่ไหม",
        "คิดถึงไหม",
        "รักไหม",
        "ชอบไหม",
        "กลับมาไหม",
        "ติดต่อไหม",
        "ทักมาไหม",
        "สำเร็จไหม",
        "ผ่านไหม",
        "ได้หรือไม่",
        "จะได้ไหม",
        "มีโอกาสไหม",
        "เป็นไปได้ไหม",
        "เขาจะ",
        "เธอจะ",
        "เราจะ",
        "จะกลับ",
        "จะติดต่อ",
        "จะทัก",
        "จะคืนดี",
        "จะกลับมา",
        "จะได้",
        "จะสำเร็จ"

    ];

    return patterns.some(
        pattern =>
            question.includes(pattern)
    );

}



/* =========================================================
   YES / NO ANSWER
========================================================= */

function getYesNoAnswer(cards){

    const total =
        cards.reduce(
            (sum,card)=>
                sum + card.score,
            0
        );


    const names =
        cards.map(card=>card.name);


    if(names.includes("The Sun")){

        return "มีแนวโน้มเป็น “ใช่” ค่อนข้างชัดครับ";

    }


    if(
        names.includes("The Star") &&
        total >= 1
    ){

        return "มีแนวโน้มเป็น “ใช่” และมีโอกาสพัฒนาไปในทางที่ดีครับ";

    }


    if(
        names.includes("The Tower") &&
        total <= -1
    ){

        return "แนวโน้มตอนนี้ออกไปทาง “ไม่ใช่” หรือมีอุปสรรคสำคัญครับ";

    }


    if(names.includes("The Moon")){

        return "ตอนนี้ยังไม่สามารถฟันธงได้ชัดเจนครับ มีบางอย่างที่ยังไม่เปิดเผย";

    }


    if(total >= 2){

        return "มีแนวโน้มเป็น “ใช่” ครับ";

    }


    if(total <= -2){

        return "มีแนวโน้มเป็น “ไม่ใช่” หรือยังไม่เป็นไปตามที่หวังครับ";

    }


    return "ตอนนี้ยังไม่ชัดเจนครับ ต้องดูสถานการณ์เพิ่มเติมก่อน";

}

/* =========================================================
   GENERATE READING
========================================================= */

function generateReading(){

    if(selectedCards.length !== 3){

        return;
    }


    const question =
        document
            .getElementById("question")
            .value
            .trim();


    const total =
        selectedCards.reduce(
            (sum,card)=>
                sum + card.score,
            0
        );


    const meanings =
        selectedCards.map(
            card =>
                getCardMeaning(card)
        );


    let overview = "";
    let summary = "";
    let advice = "";


    /* =====================================================
       YES / NO
    ===================================================== */

    if(isYesNoQuestion(question)){

        const answer =
            getYesNoAnswer(
                selectedCards
            );


        overview =
            `ไพ่ทั้ง 3 ใบสะท้อนว่า ${meanings[0]} ` +
            `${meanings[1]} และ ${meanings[2]} ` +
            `เมื่อนำมาดูรวมกัน เรื่องนี้มีพลังของสถานการณ์ที่กำลังเปลี่ยนแปลง ` +
            `และคำตอบไม่ได้อยู่ที่ไพ่ใบใดใบหนึ่งเพียงใบเดียวครับ`;


        summary =
            `${answer} ` +
            `โดยภาพรวม ไพ่บอกให้ดูทั้งสิ่งที่เกิดขึ้นตอนนี้ ` +
            `และสิ่งที่อีกฝ่ายหรือสถานการณ์กำลังแสดงออกจริง ๆ ควบคู่กันครับ`;


        advice =

            total >= 2

            ?

            "เดินหน้าได้ครับ แต่ควรค่อย ๆ ดูการกระทำและสถานการณ์จริงประกอบ อย่ารีบคาดหวังผลทันที"

            :

            total <= -2

            ?

            "ช่วงนี้อย่าเพิ่งฝืนสถานการณ์ครับ ให้เวลาและดูการเปลี่ยนแปลงก่อน แล้วค่อยตัดสินใจอีกครั้ง"

            :

            "ตอนนี้ยังมีบางอย่างที่ต้องรอให้ชัดเจนขึ้นครับ อย่าเพิ่งรีบสรุปจากความรู้สึกเพียงอย่างเดียว";

    }


    /* =====================================================
       GENERAL
    ===================================================== */

    else{

        const counts = {

            cups:0,
            wands:0,
            swords:0,
            pentacles:0

        };


        selectedCards.forEach(
            card=>{

                if(
                    counts[card.type] !== undefined
                ){

                    counts[card.type]++;

                }

            }
        );


        let dominant =
            "หลายด้านกำลังเคลื่อนไหวพร้อมกัน";


        if(counts.cups >= 2){

            dominant =
                "เรื่องความรู้สึก ความสัมพันธ์ และสิ่งที่อยู่ในใจมีอิทธิพลค่อนข้างมาก";

        }

        else if(counts.wands >= 2){

            dominant =
                "เรื่องการลงมือทำ การเปลี่ยนแปลง และการเดินหน้ามีอิทธิพลค่อนข้างมาก";

        }

        else if(counts.swords >= 2){

            dominant =
                "เรื่องความคิด การตัดสินใจ และความกังวลมีอิทธิพลค่อนข้างมาก";

        }

        else if(counts.pentacles >= 2){

            dominant =
                "เรื่องงาน เงิน ความมั่นคง และสิ่งที่จับต้องได้มีอิทธิพลค่อนข้างมาก";

        }


        overview =
            `${dominant} ไพ่ใบแรกสะท้อน ${meanings[0]} ` +
            `ขณะที่ไพ่ใบที่สองบอกว่า ${meanings[1]} ` +
            `และไพ่ใบสุดท้ายชี้ว่า ${meanings[2]}`;


        if(total >= 3){

            summary =
                "ภาพรวมถือว่ามีพลังค่อนข้างดีครับ เรื่องที่ถามมีแนวโน้มเดินหน้า หรือเริ่มเห็นช่องทางที่ดีขึ้น แต่ผลจะชัดแค่ไหนยังขึ้นอยู่กับการลงมือทำด้วย";

        }

        else if(total <= -3){

            summary =
                "ช่วงนี้มีบางอย่างติดขัดหรือยังไม่เป็นไปตามที่หวังครับ ไพ่ไม่ได้บอกว่าทุกอย่างจบ แต่บอกว่าต้องจัดการกับอุปสรรคบางอย่างก่อน";

        }

        else{

            summary =
                "ภาพรวมยังอยู่ในช่วงเปลี่ยนผ่านครับ มีทั้งด้านที่เปิดทางและด้านที่ต้องระวัง จึงควรค่อย ๆ ดูสถานการณ์ก่อนตัดสินใจครั้งสำคัญ";

        }


        advice =
            "คำแนะนำจากไพ่คือให้ดูการกระทำจริงควบคู่กับความรู้สึกครับ ถ้ามีเรื่องไหนที่ยังไม่ชัด อย่าเพิ่งรีบสรุป ให้เวลาและข้อมูลเพิ่มเติมช่วยยืนยัน";

    }


    /* =====================================================
       OUTPUT
    ===================================================== */

    document
        .getElementById("overview")
        .textContent = overview;


    document
        .getElementById("summary")
        .textContent = summary;


    document
        .getElementById("advice")
        .textContent = advice;


    document
        .getElementById("reading")
        .classList.add("show");


    /* เลื่อนให้เห็นคำทำนาย */

    setTimeout(()=>{

        document
            .getElementById("reading")
            .scrollIntoView({
                behavior:"smooth",
                block:"start"
            });

    },200);

}



/* =========================================================
   RESET
========================================================= */

function resetReading(){

    selectedCards = [];

    openedCards = 0;


    document
        .getElementById("reading")
        .classList.remove("show");


    for(let i=0;i<3;i++){

        document
            .getElementById("card"+i)
            .classList.remove("opened");


        document
            .getElementById("img"+i)
            .src = "";


        document
            .getElementById("hint"+i)
            .textContent =
                "รอเปิดไพ่";

    }

}



/* =========================================================
   COPY READING
========================================================= */

function copyReading(){

    const question =
        document
            .getElementById("question")
            .value
            .trim();


    const overview =
        document
            .getElementById("overview")
            .textContent;


    const summary =
        document
            .getElementById("summary")
            .textContent;


    const advice =
        document
            .getElementById("advice")
            .textContent;


    const text =

`🔮 ดูหมอกับพี่หมี

คำถาม:
${question}

✨ ภาพรวม
${overview}

💬 สรุปตรงคำถาม
${summary}

🌙 คำแนะนำ
${advice}`;


    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard
            .writeText(text)
            .then(()=>{

                alert(
                    "คัดลอกคำทำนายแล้วครับ"
                );

            })
            .catch(()=>{

                fallbackCopy(text);

            });

    }

    else{

        fallbackCopy(text);

    }

}



/* =========================================================
   FALLBACK COPY
========================================================= */

function fallbackCopy(text){

    const textarea =
        document.createElement("textarea");

    textarea.value = text;

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand("copy");

    textarea.remove();

    alert(
        "คัดลอกคำทำนายแล้วครับ"
    );

}

</script>
